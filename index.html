<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lock Screen</title>
  <style>
    :root {
      --bg-lock: #2b3137;
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.72);
      --gold: #d4af37;
      --gold-bright: #f5d77f;
      --key-active: rgba(255, 255, 255, 0.16);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0d12;
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top, #3a424b 0%, #20252a 100%);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 26px 18px 22px;
      transition: opacity 0.22s ease;
    }

    .screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .lock-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(16, 20, 24, 0.32) 0%, rgba(16, 20, 24, 0.72) 100%);
      pointer-events: none;
      z-index: 0;
    }

    .lock-overlay.none {
      background: transparent;
    }

    .lock-content {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Stealth top-right settings trigger + optional faint dot */
    .stealth-trigger {
      position: fixed;
      top: 0;
      right: 0;
      width: 72px;
      height: 72px;
      z-index: 75;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 12px;
    }

    .stealth-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.28);
      transition: opacity 0.2s ease;
    }

    .stealth-dot.hidden {
      opacity: 0;
    }

    /* Secret Peek Shortcut Touch Zones */
    .peek-zone {
      position: fixed;
      z-index: 70;
      background: transparent;
      display: none;
    }

    .peek-zone.bottom-left {
      bottom: 0;
      left: 0;
      width: 110px;
      height: 84px;
      display: block;
    }

    .peek-zone.bottom-right {
      bottom: 0;
      right: 0;
      width: 110px;
      height: 84px;
      display: block;
    }

    .peek-zone.top-left {
      top: 0;
      left: 0;
      width: 110px;
      height: 84px;
      display: block;
    }

    /* Relock zone on unlocked display */
    .relock-zone {
      position: fixed;
      top: 0;
      left: 0;
      width: 96px;
      height: 96px;
      z-index: 68;
      background: transparent;
    }

    /* Top center clock and date */
    .top-header {
      text-align: center;
      margin-top: 10px;
      width: 100%;
      position: relative;
    }

    .top-header.hidden-clock {
      opacity: 0;
    }

    /* Flash peek display at top center */
    .flash-peek-pill {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 85;
      padding: 4px 14px;
      border-radius: 8px;
      background: rgba(10, 12, 18, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.65);
      color: var(--gold-bright);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 4px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    .flash-peek-pill.show {
      opacity: 1;
    }

    .clock-time {
      font-size: 50px;
      font-weight: 300;
      line-height: 1.05;
      letter-spacing: 1px;
      color: var(--text-primary);
    }

    .clock-date {
      margin-top: 6px;
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    /* Keypad pushed lower */
    .keypad-wrapper {
      width: 100%;
      max-width: 340px;
      margin: auto auto 14px;
      position: relative;
      z-index: 2;
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      row-gap: 10px;
      column-gap: 14px;
    }

    .key-btn {
      height: 64px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.1s ease, transform 0.08s ease;
    }

    .key-btn:active {
      background: var(--key-active);
      transform: scale(0.96);
    }

    .key-btn.empty {
      pointer-events: none;
      background: transparent;
    }

    .key-num {
      font-size: 32px;
      font-weight: 300;
      line-height: 1.05;
    }

    .key-sub {
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--text-secondary);
      margin-top: 3px;
      text-transform: uppercase;
    }

    .tick-icon {
      font-size: 26px;
      color: rgba(255, 255, 255, 0.88);
      font-weight: 400;
    }

    /* Bottom row: larger EMERGENCY center, larger Delete right */
    .bottom-bar {
      width: 100%;
      max-width: 350px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding-top: 4px;
      position: relative;
      z-index: 2;
    }

    .bottom-center {
      grid-column: 2;
      text-align: center;
    }

    .bottom-right {
      grid-column: 3;
      text-align: right;
    }

    .bottom-action {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.86);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1.2px;
      padding: 8px 6px;
      cursor: pointer;
      white-space: nowrap;
    }

    .bottom-action:active {
      color: #ffffff;
    }

    /* Pure display-only unlocked home screen with original wallpaper aspect ratio */
    #homeScreen {
      background-color: #0b0d12;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      padding: 0;
    }

    /* System Settings Modal */
    .settings-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.86);
      z-index: 95;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .settings-backdrop.open {
      display: flex;
    }

    .settings-card {
      width: 100%;
      max-width: 410px;
      max-height: 92vh;
      overflow-y: auto;
      background: #14171f;
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 18px;
      padding: 20px 16px;
      color: #ffffff;
    }

    .settings-header {
      font-size: 20px;
      font-weight: 700;
      color: var(--gold-bright);
      margin-bottom: 14px;
    }

    .wall-accordion {
      background: #1b1e26;
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .wall-acc-head {
      padding: 12px 14px;
      background: rgba(212, 175, 55, 0.14);
      color: var(--gold-bright);
      font-size: 14px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .wall-acc-body {
      padding: 12px 14px;
    }

    .wall-acc-body.collapsed {
      display: none;
    }

    .wall-item {
      margin-bottom: 14px;
    }

    .wall-item:last-child {
      margin-bottom: 0;
    }

    .wall-item-title {
      font-size: 13px;
      color: #d0d5dd;
      margin-bottom: 8px;
    }

    .wall-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .wall-thumb {
      width: 56px;
      height: 96px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #0c0e14;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
    }

    .wall-btns {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-gallery {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: #2c303a;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-reset {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid rgba(248, 113, 113, 0.35);
      background: rgba(248, 113, 113, 0.08);
      color: #fca5a5;
      font-size: 13px;
      cursor: pointer;
    }

    .s-field {
      margin-bottom: 14px;
    }

    .s-field label {
      display: block;
      font-size: 13px;
      color: #d0d5dd;
      margin-bottom: 6px;
    }

    .s-field input,
    .s-field select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: #0e1016;
      color: #ffffff;
      font-size: 14px;
    }

    .s-footer {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .btn-close {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: transparent;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-save {
      flex: 1.2;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, var(--gold-bright), var(--gold));
      color: #0b0d12;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Flash Peek Display at Top -->
  <div class="flash-peek-pill" id="flashPeekPill">----</div>

  <!-- Top-Right Triple Tap Settings Trigger -->
  <div class="stealth-trigger" id="stealthTrigger">
    <span class="stealth-dot" id="stealthDot"></span>
  </div>

  <!-- Secret Peek Double-Tap Corner Zone -->
  <div class="peek-zone bottom-left" id="peekZone"></div>

  <!-- Lock Screen -->
  <div class="screen" id="lockScreen">
    <div class="lock-overlay" id="lockOverlay"></div>
    <div class="lock-content">
      <div class="top-header" id="topHeader">
        <div class="clock-time" id="clockTime">12:05</div>
        <div class="clock-date" id="clockDate">Wednesday, November 25</div>
      </div>

      <div class="keypad-wrapper">
        <div class="keypad-grid" id="keypadGrid"></div>
      </div>

      <div class="bottom-bar">
        <div class="bottom-center">
          <button type="button" class="bottom-action" id="emergencyBtn">EMERGENCY</button>
        </div>
        <div class="bottom-right">
          <button type="button" class="bottom-action" id="deleteBtn">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Display-only Unlocked Home Screen -->
  <div class="screen hidden" id="homeScreen">
    <div class="relock-zone" id="relockZone"></div>
  </div>

  <!-- Hidden file inputs -->
  <input type="file" id="lockFileInput" accept="image/*" style="display:none" />
  <input type="file" id="homeFileInput" accept="image/*" style="display:none" />

  <!-- System Settings Modal -->
  <div class="settings-backdrop" id="settingsModal">
    <div class="settings-card">
      <div class="settings-header">System Settings</div>

      <div class="wall-accordion">
        <div class="wall-acc-head" id="wallAccHead">
          <span>Wallpapers &amp; Backgrounds</span>
          <span id="wallAccArrow">&#9662;</span>
        </div>
        <div class="wall-acc-body" id="wallAccBody">
          <div class="wall-item">
            <div class="wall-item-title">1. Lock Screen Background (Gallery Screenshot / Wallpaper)</div>
            <div class="wall-row">
              <div class="wall-thumb" id="lockThumb"></div>
              <div class="wall-btns">
                <button type="button" class="btn-gallery" id="chooseLockBtn">Choose From Gallery</button>
                <button type="button" class="btn-reset" id="resetLockBtn">Reset Default</button>
              </div>
            </div>
          </div>

          <div class="wall-item">
            <div class="wall-item-title">2. Unlocked Screen Background (Home Screen Screenshot)</div>
            <div class="wall-row">
              <div class="wall-thumb" id="homeThumb"></div>
              <div class="wall-btns">
                <button type="button" class="btn-gallery" id="chooseHomeBtn">Choose From Gallery</button>
                <button type="button" class="btn-reset" id="resetHomeBtn">Reset Default</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="s-field">
        <label>Secret Peek Shortcut (View Spectator Password)</label>
        <select id="cfgPeekShortcut">
          <option value="bottom-left">Bottom-Left Corner: Double Tap</option>
          <option value="bottom-right">Bottom-Right Corner: Double Tap</option>
          <option value="top-left">Top-Left Corner: Double Tap</option>
          <option value="emergency">Emergency Button: Double Tap</option>
        </select>
      </div>

      <div class="s-field">
        <label>Unlock Mode</label>
        <select id="cfgUnlockMode">
          <option value="force">Force Unlock (Any Code Unlocks)</option>
          <option value="exact">Exact Target Match Only</option>
          <option value="peek">Peek Only (Never Unlocks)</option>
        </select>
      </div>

      <div class="s-field">
        <label>Passcode Length</label>
        <select id="cfgPassLength">
          <option value="4">4 Digits</option>
          <option value="6">6 Digits</option>
        </select>
      </div>

      <div class="s-field">
        <label>Target Passcode</label>
        <input type="text" id="cfgTarget" placeholder="1996" />
      </div>

      <div class="s-field">
        <label>Lock Screen Clock &amp; Overlay Style</label>
        <select id="cfgOverlayStyle">
          <option value="clock_overlay">Live Clock, Date &amp; Keypad</option>
          <option value="clock_clean">Live Clock, Date (No Dark Tint)</option>
          <option value="keypad_only">Keypad Only (Hide Clock)</option>
        </select>
      </div>

      <div class="s-field">
        <label>Stealth Corner Dot</label>
        <select id="cfgCornerDot">
          <option value="visible">Visible (Faint Dot)</option>
          <option value="hidden">Hidden (Invisible)</option>
        </select>
      </div>

      <div class="s-field">
        <label>Firebase Realtime Database URL (Optional Live Sync)</label>
        <input type="text" id="cfgFbUrl" placeholder="https://mentalist-peek-app-default-rtdb.firebaseio.com" />
      </div>

      <div class="s-field">
        <label>Session Room ID</label>
        <input type="text" id="cfgRoomId" placeholder="oppo_passcode_room" />
      </div>

      <div class="s-footer">
        <button type="button" class="btn-close" id="closeSettingsBtn">Close</button>
        <button type="button" class="btn-save" id="saveSettingsBtn">Save &amp; Apply</button>
      </div>
    </div>
  </div>

  <script>
    const CFG_KEY = "mentalist_lock_cfg_v9";
    const STATE_KEY = "mentalist_lock_state_v9";
    const QUEUE_KEY = "mentalist_lock_queue_v9";

    const DEFAULT_CFG = {
      lockWall: "",
      homeWall: "",
      peekShortcut: "bottom-left",
      unlockMode: "force",
      passLength: 4,
      target: "1996",
      overlayStyle: "clock_overlay",
      cornerDot: "visible",
      fbUrl: "https://mentalist-peek-app-default-rtdb.firebaseio.com",
      roomId: "oppo_passcode_room"
    };

    let cfg = loadCfg();
    let draftLockWall = cfg.lockWall;
    let draftHomeWall = cfg.homeWall;
    let typedDigits = "";
    let lastCompleted = "";
    let tripleTapTimes = [];
    let lastPeekTapTime = 0;
    let lastEmergencyTapTime = 0;
    let lastRelockTapTime = 0;
    let flashTimer = null;

    function loadCfg() {
      try {
        return Object.assign({}, DEFAULT_CFG, JSON.parse(localStorage.getItem(CFG_KEY) || "{}"));
      } catch (e) {
        return Object.assign({}, DEFAULT_CFG);
      }
    }

    function saveCfg() {
      try {
        localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
      } catch (e) {}
    }

    function loadQueue() {
      try {
        return JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]");
      } catch (e) {
        return [];
      }
    }

    function saveQueue(q) {
      try {
        localStorage.setItem(QUEUE_KEY, JSON.stringify(q.slice(-40)));
      } catch (e) {}
    }

    function saveLocalState(statusText) {
      const payload = {
        typed: typedDigits,
        lastCompleted: lastCompleted || "-",
        target: cfg.target || "-",
        status: statusText || "typing",
        updatedAt: Date.now()
      };
      try {
        localStorage.setItem(STATE_KEY, JSON.stringify(payload));
      } catch (e) {}

      const q = loadQueue();
      q.push(payload);
      saveQueue(q);
      flushQueueToFirebase();
    }

    async function flushQueueToFirebase() {
      const baseUrl = (cfg.fbUrl || "").trim().replace(/\/+$/, "");
      const room = encodeURIComponent((cfg.roomId || "oppo_passcode_room").trim());
      if (!baseUrl || !navigator.onLine) return;

      const q = loadQueue();
      if (!q.length) return;

      const latest = q[q.length - 1];
      const endpoint = baseUrl + "/passcode_peek/" + room + ".json";

      try {
        const res = await fetch(endpoint, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(latest)
        });
        if (res.ok) {
          saveQueue([]);
        }
      } catch (e) {}
    }

    function triggerFlashPeek() {
      let localSt = {};
      try {
        localSt = JSON.parse(localStorage.getItem(STATE_KEY) || "{}");
      } catch (e) {}

      const codeToShow = typedDigits || lastCompleted || localSt.lastCompleted || localSt.typed || "----";
      const pill = document.getElementById("flashPeekPill");
      pill.textContent = codeToShow;
      pill.classList.add("show");

      if (flashTimer) clearTimeout(flashTimer);
      flashTimer = setTimeout(() => {
        pill.classList.remove("show");
      }, 2200);
    }

    function handleDoubleTap(lastTimeRefSetter, lastTimeVal) {
      const now = Date.now();
      if (now - lastTimeVal < 500) {
        lastTimeRefSetter(0);
        triggerFlashPeek();
      } else {
        lastTimeRefSetter(now);
      }
    }

    function updateClock() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      const timeStr = hh + ":" + mm;
      const dateStr = now.toLocaleDateString("en-US", {
        weekday: "long",
        month: "long",
        day: "numeric"
      });
      document.getElementById("clockTime").textContent = timeStr;
      document.getElementById("clockDate").textContent = dateStr;
    }

    function buildKeypad() {
      const grid = document.getElementById("keypadGrid");
      grid.innerHTML = "";

      const keys = [
        { num: "1", sub: "" },
        { num: "2", sub: "ABC" },
        { num: "3", sub: "DEF" },
        { num: "4", sub: "GHI" },
        { num: "5", sub: "JKL" },
        { num: "6", sub: "MNO" },
        { num: "7", sub: "PQRS" },
        { num: "8", sub: "TUV" },
        { num: "9", sub: "WXYZ" },
        { empty: true },
        { num: "0", sub: "+" },
        { confirm: true }
      ];

      keys.forEach((k) => {
        const btn = document.createElement("button");
        btn.type = "button";
        if (k.empty) {
          btn.className = "key-btn empty";
          grid.appendChild(btn);
          return;
        }
        if (k.confirm) {
          btn.className = "key-btn";
          btn.innerHTML = '<span class="tick-icon">&#10003;</span>';
          btn.addEventListener("click", handleConfirmTick);
          grid.appendChild(btn);
          return;
        }
        btn.className = "key-btn";
        btn.innerHTML =
          '<span class="key-num">' + k.num + "</span>" +
          (k.sub ? '<span class="key-sub">' + k.sub + "</span>" : "");
        btn.addEventListener("click", () => handleDigit(k.num));
        grid.appendChild(btn);
      });
    }

    function unlockScreen() {
      document.getElementById("lockScreen").classList.add("hidden");
      document.getElementById("homeScreen").classList.remove("hidden");
      saveLocalState("unlocked");
    }

    function lockScreen() {
      typedDigits = "";
      document.getElementById("homeScreen").classList.add("hidden");
      document.getElementById("lockScreen").classList.remove("hidden");
      saveLocalState("locked");
    }

    function evaluateCompletion(completedCode) {
      lastCompleted = completedCode;
      saveLocalState("completed");

      setTimeout(() => {
        if (cfg.unlockMode === "force") {
          typedDigits = "";
          unlockScreen();
        } else if (cfg.unlockMode === "exact") {
          if (cfg.target && completedCode === cfg.target.trim()) {
            typedDigits = "";
            unlockScreen();
          } else {
            typedDigits = "";
            saveLocalState("retry");
          }
        } else {
          typedDigits = "";
          saveLocalState("peek_only");
        }
      }, 140);
    }

    function handleConfirmTick() {
      if (!typedDigits.length) return;
      evaluateCompletion(typedDigits);
    }

    function handleDigit(digit) {
      const maxLen = parseInt(cfg.passLength, 10) || 4;
      if (typedDigits.length >= maxLen) {
        typedDigits = "";
      }
      typedDigits += digit;
      saveLocalState("typing");

      if (typedDigits.length === maxLen) {
        evaluateCompletion(typedDigits);
      }
    }

    function handleBackspace() {
      if (!typedDigits.length) return;
      typedDigits = typedDigits.slice(0, -1);
      saveLocalState("typing");
    }

    function applyVisualConfig() {
      const lockEl = document.getElementById("lockScreen");
      const homeEl = document.getElementById("homeScreen");
      const overlayEl = document.getElementById("lockOverlay");
      const headerEl = document.getElementById("topHeader");
      const dotEl = document.getElementById("stealthDot");
      const zoneEl = document.getElementById("peekZone");

      lockEl.style.backgroundImage = cfg.lockWall ? "url('" + cfg.lockWall + "')" : "";
      homeEl.style.backgroundImage = cfg.homeWall ? "url('" + cfg.homeWall + "')" : "";

      if (cfg.overlayStyle === "clock_clean") {
        overlayEl.classList.add("none");
        headerEl.classList.remove("hidden-clock");
      } else if (cfg.overlayStyle === "keypad_only") {
        overlayEl.classList.remove("none");
        headerEl.classList.add("hidden-clock");
      } else {
        overlayEl.classList.remove("none");
        headerEl.classList.remove("hidden-clock");
      }

      if (cfg.cornerDot === "hidden") {
        dotEl.classList.add("hidden");
      } else {
        dotEl.classList.remove("hidden");
      }

      zoneEl.className = "peek-zone";
      if (cfg.peekShortcut === "bottom-left") {
        zoneEl.classList.add("bottom-left");
      } else if (cfg.peekShortcut === "bottom-right") {
        zoneEl.classList.add("bottom-right");
      } else if (cfg.peekShortcut === "top-left") {
        zoneEl.classList.add("top-left");
      }
    }

    function refreshThumbs() {
      const lockThumb = document.getElementById("lockThumb");
      const homeThumb = document.getElementById("homeThumb");
      lockThumb.style.backgroundImage = draftLockWall ? "url('" + draftLockWall + "')" : "none";
      homeThumb.style.backgroundImage = draftHomeWall ? "url('" + draftHomeWall + "')" : "none";
    }

    function openSettings() {
      draftLockWall = cfg.lockWall || "";
      draftHomeWall = cfg.homeWall || "";
      refreshThumbs();

      document.getElementById("cfgPeekShortcut").value = cfg.peekShortcut || "bottom-left";
      document.getElementById("cfgUnlockMode").value = cfg.unlockMode || "force";
      document.getElementById("cfgPassLength").value = String(cfg.passLength || 4);
      document.getElementById("cfgTarget").value = cfg.target || "";
      document.getElementById("cfgOverlayStyle").value = cfg.overlayStyle || "clock_overlay";
      document.getElementById("cfgCornerDot").value = cfg.cornerDot || "visible";
      document.getElementById("cfgFbUrl").value = cfg.fbUrl || "";
      document.getElementById("cfgRoomId").value = cfg.roomId || "oppo_passcode_room";

      document.getElementById("settingsModal").classList.add("open");
    }

    function readImageToDataUrl(file, cb) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (ev) {
        cb(ev.target.result);
      };
      reader.readAsDataURL(file);
    }

    /* Triple-tap top-right for System Settings */
    document.getElementById("stealthTrigger").addEventListener("click", () => {
      const now = Date.now();
      tripleTapTimes = tripleTapTimes.filter((t) => now - t < 750);
      tripleTapTimes.push(now);
      if (tripleTapTimes.length >= 3) {
        tripleTapTimes = [];
        openSettings();
      }
    });

    /* Double-tap corner zone for Flash Peek */
    document.getElementById("peekZone").addEventListener("click", () => {
      handleDoubleTap((v) => { lastPeekTapTime = v; }, lastPeekTapTime);
    });

    /* Emergency button (supports double-tap peek if selected) */
    document.getElementById("emergencyBtn").addEventListener("click", () => {
      if (cfg.peekShortcut === "emergency") {
        handleDoubleTap((v) => { lastEmergencyTapTime = v; }, lastEmergencyTapTime);
      }
    });

    /* Double-tap top-left on unlocked display to re-lock */
    document.getElementById("relockZone").addEventListener("click", () => {
      handleDoubleTap((v) => { lastRelockTapTime = v; }, lastRelockTapTime);
    });

    document.getElementById("deleteBtn").addEventListener("click", handleBackspace);

    /* Settings accordion & gallery controls */
    document.getElementById("wallAccHead").addEventListener("click", () => {
      const body = document.getElementById("wallAccBody");
      const arrow = document.getElementById("wallAccArrow");
      body.classList.toggle("collapsed");
      arrow.innerHTML = body.classList.contains("collapsed") ? "&#9656;" : "&#9662;";
    });

    document.getElementById("chooseLockBtn").addEventListener("click", () => {
      document.getElementById("lockFileInput").click();
    });
    document.getElementById("lockFileInput").addEventListener("change", (e) => {
      readImageToDataUrl(e.target.files[0], (dataUrl) => {
        draftLockWall = dataUrl;
        refreshThumbs();
      });
    });
    document.getElementById("resetLockBtn").addEventListener("click", () => {
      draftLockWall = "";
      document.getElementById("lockFileInput").value = "";
      refreshThumbs();
    });

    document.getElementById("chooseHomeBtn").addEventListener("click", () => {
      document.getElementById("homeFileInput").click();
    });
    document.getElementById("homeFileInput").addEventListener("change", (e) => {
      readImageToDataUrl(e.target.files[0], (dataUrl) => {
        draftHomeWall = dataUrl;
        refreshThumbs();
      });
    });
    document.getElementById("resetHomeBtn").addEventListener("click", () => {
      draftHomeWall = "";
      document.getElementById("homeFileInput").value = "";
      refreshThumbs();
    });

    document.getElementById("closeSettingsBtn").addEventListener("click", () => {
      document.getElementById("settingsModal").classList.remove("open");
    });

    document.getElementById("saveSettingsBtn").addEventListener("click", () => {
      cfg.lockWall = draftLockWall;
      cfg.homeWall = draftHomeWall;
      cfg.peekShortcut = document.getElementById("cfgPeekShortcut").value;
      cfg.unlockMode = document.getElementById("cfgUnlockMode").value;
      cfg.passLength = parseInt(document.getElementById("cfgPassLength").value, 10) || 4;
      cfg.target = document.getElementById("cfgTarget").value.trim();
      cfg.overlayStyle = document.getElementById("cfgOverlayStyle").value;
      cfg.cornerDot = document.getElementById("cfgCornerDot").value;
      cfg.fbUrl = document.getElementById("cfgFbUrl").value.trim();
      cfg.roomId = document.getElementById("cfgRoomId").value.trim() || "oppo_passcode_room";

      saveCfg();
      applyVisualConfig();
      flushQueueToFirebase();
      document.getElementById("settingsModal").classList.remove("open");
    });

    window.addEventListener("online", flushQueueToFirebase);

    buildKeypad();
    applyVisualConfig();
    updateClock();
    setInterval(updateClock, 1000);
    setInterval(flushQueueToFirebase, 4000);
  </script>
</body>
</html>
